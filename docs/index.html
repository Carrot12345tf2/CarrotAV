<style>
  /*
    Layout mirrors the Canva design exactly: a 1366 x 1541 "stage" where every
    element sits at its original position, size, rotation and stacking order.
    The whole stage scales with the window width (like the Canva site does).
    Edit positions with --x / --y / --w / --h (design pixels).
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #c1f5fc; }
  body { font-family: 'Anton', Impact, 'Arial Narrow Bold', sans-serif; overflow-x: hidden; }

  .stage {
    width: min(100%, 1366px);
    margin: 0 auto;
    container-type: inline-size;
  }
  .canvas {
    --u: calc(100cqw / 1366);           /* 1 design pixel */
    position: relative;
    height: calc(1541 * var(--u));
    overflow: hidden;
  }

  .el {
    position: absolute;
    left:   calc(var(--x) * var(--u));
    top:    calc(var(--y) * var(--u));
    width:  calc(var(--w) * var(--u));
    height: calc(var(--h) * var(--u));
    display: block;
  }
  img.el { object-fit: fill; }

  /* Text boxes */
  .txt {
    color: #ff751f;
    font-size: calc(var(--fs) * var(--u));
    line-height: calc(var(--h) * var(--u));
    text-align: center;
    white-space: pre;
  }
  a.txt {
    text-decoration: underline;
    text-decoration-thickness: calc(3 * var(--u));
    text-underline-offset: calc(4 * var(--u));
  }
  a.txt.black { color: #000; }
  .txt.dark { color: #fd7915; }

  /* Transforms taken from the Canva page */
  .flip-both { transform: rotate(180deg); }
  .flip-v    { transform: scaleY(-1); }
  .rot-logo  { transform: rotate(-33.6deg); }
  .rot-patch { transform: rotate(-20.7deg); }

  /* Divider line with diamond ends */
  .divider { background: #ff751f; height: calc(3 * var(--u)); margin-top: calc(0.5 * var(--u)); }
  .divider::before, .divider::after {
    content: "";
    position: absolute;
    top: 50%;
    width: calc(9 * var(--u)); height: calc(9 * var(--u));
    border: calc(2 * var(--u)) solid #ff751f;
    background: #c1f5fc;
    transform: translateY(-50%) rotate(45deg);
  }
  .divider::before { left: 0; }
  .divider::after  { right: 0; }

  footer {
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    padding: 10px 16px;
  }
</style>
</head>
